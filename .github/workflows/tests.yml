name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The project itself is standard library only; pypdf is for converting PDFs. No model
      # or account is needed: the benchmark tests re-score saved answers, and the workflow
      # tests run each n8n Code node under Node with its inputs mocked.
      - run: pip install pypdf
      - run: python -m unittest discover -s tests -v
